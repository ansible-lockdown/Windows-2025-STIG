---

- name: "HIGH | WN25-CC-000210 | PATCH | Windows Server 2025 AutoPlay must be turned off for non-volume devices."
  when: wn25_cc_000210 | bool
  tags:
    - WN25-CC-000210
    - CAT1
    - CCI-001764
    - SRG-OS-000368-GPOS-00154
    - SV-278099r1181003_rule
    - V-278099
    - NIST800-53_4_CM-7
  ansible.windows.win_regedit:
    path: HKLM:\Software\Policies\Microsoft\Windows\Explorer
    value: NoAutoplayfornonVolume
    data: 1
    datatype: dword

- name: "HIGH | WN25-CC-000220 | PATCH | Windows Server 2025 default AutoRun behavior must be configured to prevent AutoRun commands."
  when: wn25_cc_000220 | bool
  tags:
    - WN25-CC-000220
    - CAT1
    - CCI-001764
    - SRG-OS-000368-GPOS-00154
    - SV-278100r1181006_rule
    - V-278100
    - NIST800-53_4_CM-7_2
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    value: NoAutorun
    data: 1
    datatype: dword

- name: "HIGH | WN25-CC-000230 | PATCH | Windows Server 2025 AutoPlay must be disabled for all drives."
  when: wn25_cc_000230 | bool
  tags:
    - WN25-CC-000230
    - CAT1
    - CCI-001764
    - SRG-OS-000368-GPOS-00154
    - SV-278101r1181009_rule
    - V-278101
    - NIST800-53_4_CM-7_2
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    name: NoDriveTypeAutoRun
    data: 255
    datatype: dword

- name: "HIGH | WN25-CC-000430 | PATCH | Windows Server 2025 must disable the Windows Installer Always install with elevated privileges option."
  when: wn25_cc_000430 | bool
  tags:
    - WN25-CC-000430
    - CAT1
    - CCI-003980
    - SRG-OS-000362-GPOS-00149
    - SV-278121r1181069_rule
    - V-278121
    - NIST800-53_4_CM-11_2
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer
    state: present
    value: AlwaysInstallElevated
    data: 0
    datatype: dword

- name: "HIGH | WN25-CC-000470 | PATCH | Windows Server 2025 Windows Remote Management (WinRM) client must not use Basic authentication."
  when:
    - wn25_cc_000470 | bool
    - not win_skip_for_test | bool
  tags:
    - WN25-CC-000470
    - CAT1
    - CCI-000877
    - SRG-OS-000125-GPOS-00065
    - SV-278125r1181081_rule
    - V-278125
    - winrm
    - NIST800-53_MA-4_c
    - NIST800-53_4_MA-4_c
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client
    value: AllowBasic
    data: 0
    datatype: dword

- name: "HIGH | WN25-CC-000500 | PATCH | Windows Server 2025 Windows Remote Management (WinRM) service must not use Basic authentication."
  when:
    - wn25_cc_000500 | bool
    - not win_skip_for_test | bool
  tags:
    - WN25-CC-000500
    - CAT1
    - CCI-000877
    - SRG-OS-000125-GPOS-00065
    - SV-278128r1181090_rule
    - V-278128
    - winrm
    - NIST800-53_MA-4_c
    - NIST800-53_4_MA-4_c
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service
    value: AllowBasic
    data: 0
    datatype: dword
