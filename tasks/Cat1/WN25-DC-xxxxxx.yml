---

- name: "HIGH | WN25-DC-000010 | AUDIT | Windows Server 2025 must only allow administrators responsible for the domain controller to have Administrator rights on the system."
  when:
    - wn25_dc_000010 | bool
    - "'controller' in ansible_facts['windows_domain_role']"
  tags:
    - WN25-DC-000010
    - CAT1
    - CCI-002235
    - SRG-OS-000324-GPOS-00125
    - SV-278132r1181102_rule
    - V-278132
    - audit
    - NIST800-53_4_AC-6_10
  block:
    - name: "HIGH | WN25-DC-000010 | AUDIT | Windows Server 2025 must only allow administrators responsible for the domain controller to have Administrator rights on the system."
      ansible.windows.win_shell: get-localgroupmember administrators | Select name | Format-Table -HideTableHeaders
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_dc_000010_admin_usrs

    - name: "HIGH | WN25-DC-000010 | AUDIT | Windows Server 2025 must only allow administrators responsible for the domain controller to have Administrator rights on the system."
      ansible.builtin.debug:
        msg:
          - "Alert! Below are the users in the Administrators group. Please review and confirm all users should be in this group"
          - "{{ discovered_dc_000010_admin_usrs.stdout_lines }}"

    - name: "HIGH | WN25-DC-000010 | AUDIT | Windows Server 2025 must only allow administrators responsible for the domain controller to have Administrator rights on the system. | Warn Count."
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-DC-000010"

