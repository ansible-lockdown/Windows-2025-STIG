---

- name: "LOW | WN25-CC-000030 | PATCH | Windows Server 2025 Internet Protocol version 6 (IPv6) source routing must be configured to the highest protection level to prevent IP source routing."
  when: wn25_cc_000030 | bool
  tags:
    - WN25-CC-000030
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-278082r1180952_rule
    - V-278082
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
    value: DisableIPSourceRouting
    data: 2
    datatype: dword

- name: "LOW | WN25-CC-000040 | PATCH | Windows Server 2025 source routing must be configured to the highest protection level to prevent Internet Protocol (IP) source routing."
  when: wn25_cc_000040 | bool
  tags:
    - WN25-CC-000040
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-278083r1180955_rule
    - V-278083
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
    value: DisableIPSourceRouting
    data: 2
    datatype: dword

- name: "LOW | WN25-CC-000050 | PATCH | Windows Server 2025 must be configured to prevent Internet Control Message Protocol (ICMP) redirects from overriding Open Shortest Path First (OSPF)-generated routes."
  when: wn25_cc_000050 | bool
  tags:
    - WN25-CC-000050
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-278084r1180958_rule
    - V-278084
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
    value: EnableICMPRedirect
    data: 0
    datatype: dword

- name: "LOW | WN25-CC-000060 | PATCH | Windows Server 2025 Must be configured to ignore NetBIOS name release requests except from WINS servers."
  when: wn25_cc_000060 | bool
  tags:
    - WN25-CC-000060
    - CAT3
    - CCI-002385
    - SRG-OS-000420-GPOS-00186
    - SV-278085r1180961_rule
    - V-278085
    - NIST800-53_4_SC-5
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Netbt\Parameters
    value: NoNameReleaseOnDemand
    data: 1
    datatype: dword

- name: "LOW | WN25-CC-000200 | PATCH | Windows Server 2025 Application Compatibility Program Inventory must be prevented from collecting data and sending the information to Microsoft."
  when: wn25_cc_000200 | bool
  tags:
    - WN25-CC-000200
    - CAT3
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-278098r1181000_rule
    - V-278098
    - NIST800-53_CM-7
    - NIST800-53_A_CM-7_1_ii
    - NIST800-53_4_CM-7_a
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat
    value: DisableInventory
    data: 1
    datatype: dword

- name: "LOW | WN25-CC-000260 | PATCH | Windows Server 2025 Windows Update must not obtain updates from other PCs on the Internet."
  when: wn25_cc_000260 | bool
  tags:
    - WN25-CC-000260
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-278104r1181018_rule
    - V-278104
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization
    value: DODownloadMode
    data: "{{ win25stig_dodownloadmode }}"
    datatype: dword

- name: "LOW | WN25-CC-000320 | PATCH | Windows Server 2025 turning off File Explorer heap termination on corruption must be disabled."
  when: wn25_cc_000320 | bool
  tags:
    - WN25-CC-000320
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-278110r1182063_rule
    - V-278110
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer
    value: NoHeapTerminationOnCorruption
    state: present
    data: 0
    datatype: dword
