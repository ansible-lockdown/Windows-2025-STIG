---

# XCCDF: applies to domain controllers only; not applicable to other systems.
- name: "LOW | WN25-DC-000160 | AUDIT | Windows Server 2025 directory service must be configured to terminate LDAP-based network connections to the directory server after 5 minutes of inactivity."
  when:
    - wn25_dc_000160 | bool
    - "'controller' in ansible_facts['windows_domain_role']"
  tags:
    - WN25-DC-000160
    - CAT3
    - CCI-001133
    - CCI-002361
    - SRG-OS-000163-GPOS-00072
    - SV-278147r1192630_rule
    - V-278147
    - NIST800-53_SC-10
    - NIST800-53_A_SC-10_1_ii
    - NIST800-53_4_SC-10
    - NIST800-53_4_AC-12
  block:
    - name: "LOW | WN25-DC-000160 | AUDIT | Windows Server 2025 directory service must be configured to terminate LDAP-based network connections to the directory server after 5 minutes of inactivity."
      ansible.builtin.debug:
        msg: "Warning!! This is a manual task. Windows Server 2025 directory service must be configured to terminate LDAP-based network connections to the directory server after 5 minutes of inactivity."

    - name: "LOW | WN25-DC-000160 | AUDIT | Windows Server 2025 directory service must be configured to terminate LDAP-based network connections to the directory server after 5 minutes of inactivity. | import reusable task."
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-DC-000160"
