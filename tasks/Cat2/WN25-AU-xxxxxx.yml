- name: "MEDIUM | WN25-AU-000030 | AUDIT | Windows Server 2025 permissions for the Application event log must prevent access by non-privileged accounts."
  when: wn25_au_000030 | bool
  tags:
    - WN25-AU-000030
    - CAT2
    - CCI-000162
    - CCI-000163
    - CCI-000164
    - SRG-OS-000057-GPOS-00027
    - SV-278043r1180835_rule
    - V-278043
    - NIST800-53_AU_9
    - NIST800-53_A_AU-9_1
    - NIST800-53_4_AU-9
  block:
    - name: "MEDIUM | WN25-AU-000030 | PATCH | Windows 2025 permissions for the Application event log must prevent access by non-privileged accounts. | Get Default Log Locations."
      ansible.windows.win_shell: Get-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\ | Select-Object File | ft -HideTableHeaders
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_au_000030_app_log_location

    - name: "MEDIUM | WN25-AU-000030 | AUDIT | Windows 2025 permissions for the Application event log must prevent access by non-privileged accounts. | Get Current Permissions For Default Application Log."
      ansible.windows.win_shell: get-acl "{{ discovered_au_000030_app_log_location.stdout | trim }}" | FL AccessToString
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_au_000030_app_log_permissions

    - name: "MEDIUM | WN25-AU-000030 | AUDIT | Windows 2025 permissions for the Application event log must prevent access by non-privileged accounts. | Permissions warning for accounts."
      ansible.builtin.debug:
        msg:
          - "Warning!! Ensure the permissions on the Application event log (Application.evtx) are configured"
          - "to prevent standard user accounts or groups from having access. The default permissions listed below satisfy this requirement:"
          - "Eventlog - Full Control, SYSTEM - Full Control, Administrators - Full Control"
          - "Current location of Application.evtx is {{ discovered_au_000030_app_log_location.stdout | trim }}"
          - "If there is no output below If the location of the logs has been changed, when adding Eventlog to the permissions,"
          - "it must be entered as NT Service\\Eventlog"
          - "{{ discovered_au_000030_app_log_permissions.stdout_lines | reject('match', '^$') | list }}"

    - name: "MEDIUM | WN25-AU-000030 | AUDIT | Windows 2025 permissions for the Application event log must prevent access by non-privileged accounts. | Warn Count."
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-AU-000030"

