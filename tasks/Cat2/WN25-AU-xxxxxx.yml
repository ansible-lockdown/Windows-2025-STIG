- name: "MEDIUM | WN25-AU-000010 | AUDIT | Windows Server 2025 audit records must be backed up to a different system or media than the system being audited."
  when: wn25_au_000010 | bool
  tags:
    - WN25-AU-000010
    - CAT2
    - CCI-001851
    - SRG-OS-000342-GPOS-00133
    - SV-278041r1180829_rule
    - V-278041
    - NIST800-53_4_AU_4_1
  block:
    - name: "MEDIUM | WN25-AU-000010 | AUDIT | Windows Server 2025 audit records must be backed up to a different system or media than the system being audited."
      ansible.builtin.debug:
        msg:
          - "Warning!! This is a manual task. Windows Server 2025 audit records must be backed up to a"
          - "different system or media than the system being audited. Establish and implement a process"
          - "for backing up log data to another system or media other than the system being audited."

    - name: "MEDIUM | WN25-AU-000010 | AUDIT | Windows Server 2025 audit records must be backed up to a different system or media than the system being audited. | import reusable task."
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-AU-000010"

