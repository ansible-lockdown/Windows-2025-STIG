- name: "MEDIUM | WN25-CC-000110 | PATCH | Windows Server 2025 virtualization-based security must be enabled with the platform security level configured to Secure Boot or Secure Boot with DMA Protection."
  when:
    - wn25_cc_000110 | bool
    - ansible_facts['windows_domain_member']
  tags:
    - WN25-CC-000110
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-278090r1182274_rule
    - V-278090
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  block:
    - name: "MEDIUM | WN25-CC-000110 | PATCH | Windows Server 2025 virtualization-based security must be enabled with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | EnableVirtualizationBasedSecurity Registry Add"
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\
        state: present
        value: EnableVirtualizationBasedSecurity
        data: 1
        datatype: dword

    - name: "MEDIUM | WN25-CC-000110 | PATCH | Windows Server 2025 virtualization-based security must be enabled with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | RequirePlatformSecurityFeatures Registry Add"
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\
        state: present
        value: RequirePlatformSecurityFeatures
        data: "{{ win25stig_dma_protection }}"
        datatype: dword

    - name: "MEDIUM | WN25-CC-000110 | AUDIT | Windows Server 2025 virtualization-based security must be enabled with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Get Status Of Device Guard Virtualization."
      ansible.windows.win_shell: Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard | Select-Object VirtualizationBasedSecurityStatus | ft -hidetableheaders
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_cc_000110_audit

    - name: "MEDIUM | WN25-CC-000110 | AUDIT | Windows Server 2025 virtualization-based security must be enabled with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Device Guard Virtualization based security Not Running Warning Message."
      when: "'2' not in discovered_cc_000110_audit.stdout | trim"
      ansible.builtin.debug:
        msg:
          - "Warning!! This is a manual task. Windows Server 2025 virtualization-based security must be enabled with the platform security"
          - "level configured to Secure Boot or Secure Boot with DMA Protection. The policy settings referenced in the Fix section will"
          - "configure the following registry values. However, due to hardware requirements, the registry values alone do not ensure proper"
          - "function."

    - name: "MEDIUM | WN25-CC-000110 | AUDIT | Windows Server 2025 virtualization-based security must be enabled with the platform security level configured to Secure Boot or Secure Boot with DMA Protection. | Warn Count"
      when: "'2' not in discovered_cc_000110_audit.stdout | trim"
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-CC-000110"

