- name: "MEDIUM | WN25-CC-000270 | PATCH | Windows Server 2025 Application event log size must be configured to 32768 KB or greater."
  when: wn25_cc_000270 | bool
  tags:
    - WN25-CC-000270
    - CAT2
    - CCI-001849
    - SRG-OS-000341-GPOS-00132
    - SV-278105r1181812_rule
    - V-278105
    - NIST800-53_4_AU-4
  block:
    - name: "MEDIUM | WN25-CC-000270 | PATCH | Windows Server 2025 Application event log size must be configured to 32768 KB or greater. | Warning Message."
      when: win25stig_application_event_log_max_size < 32768
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid file size set for win25stig_application_event_log_max_size please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN25-CC-000270 | PATCH | Windows Server 2025 Application event log size must be configured to 32768 KB or greater. | Warn Count."
      when: win25stig_application_event_log_max_size < 32768
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-CC-000270"

    - name: "MEDIUM | WN25-CC-000270 | PATCH | Windows Server 2025 Application event log size must be configured to 32768 KB or greater. | Apply Log Size"
      when: win25stig_application_event_log_max_size >= 32768
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application
        state: present
        value: MaxSize
        data: "{{ win25stig_application_event_log_max_size }}"
        datatype: dword

