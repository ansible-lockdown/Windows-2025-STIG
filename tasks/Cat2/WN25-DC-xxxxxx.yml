- name: "MEDIUM | WN25-DC-000230 | PATCH | Windows Server 2025 must be configured to audit Account Management | Computer Account Management successes."
  when:
    - wn25_dc_000230 | bool
    - "'controller' in ansible_facts['windows_domain_role']"
  tags:
    - WN25-DC-000230
    - CAT2
    - CCI-000018
    - CCI-000172
    - CCI-001403
    - CCI-001404
    - CCI-001405
    - CCI-002130
    - SRG-OS-000004-GPOS-00004
    - SV-278154r1182114_rule
    - V-278154
    - audit
    - NIST800-53_AC-2_4
    - NIST800-53_A_AC-2_4_1_i_iii
    - NIST800-53_4_AC-2_4
    - NIST800-53_AU-12_c
    - NIST800-53_A_AU-12_1_iv
    - NIST800-53_4_AU-12_c
  block:
    - name: "MEDIUM | WN25-DC-000230 | AUDIT | Windows Server 2025 must be configured to audit Account Management | Computer Account Management successes."
      ansible.windows.win_shell: AuditPol /get /subcategory:"Computer Account Management" -r | ConvertFrom-Csv | Select-Object -expand "Inclusion Setting"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_dc_000230_audit

    - name: "MEDIUM | WN25-DC-000230 | PATCH | Windows Server 2025 must be configured to audit Account Management | Computer Account Management successes."
      when: "'Success' not in discovered_dc_000230_audit.stdout"
      ansible.windows.win_shell: AuditPol /set /subcategory:"Computer Account Management" /success:enable

