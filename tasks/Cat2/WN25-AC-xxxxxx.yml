---

- name: "MEDIUM | WN25-AC-000020 | PATCH | Windows Server 2025 must have the number of allowed bad logon attempts configured to three or less."
  when:
    - wn25_ac_000020 | bool
    - not discovered_account_policy_is_domain_scoped | bool
  tags:
    - WN25-AC-000020
    - CAT2
    - CCI-000044
    - SRG-OS-000021-GPOS-00005
    - SV-278034r1180808_rule
    - V-278034
    - NIST800-53_AC-7_a
    - NIST800-53_A_AC-7_1_ii
    - NIST800-53_4_AC-7_a
  block:
    - name: "MEDIUM | WN25-AC-000020 | AUDIT | Windows Server 2025 must have the number of allowed bad logon attempts configured to three or less. | Warning For Bad Variable."
      when: win25stig_lockoutbadcount == 0 or win25stig_lockoutbadcount > 3
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid number of failed logon attempts set for win25stig_lockoutbadcount please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN25-AC-000020 | AUDIT | Windows Server 2025 must have the number of allowed bad logon attempts configured to three or less. | Warn Count."
      when: win25stig_lockoutbadcount == 0 or win25stig_lockoutbadcount > 3
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-AC-000020"

    - name: "MEDIUM | WN25-AC-000020 | PATCH | Windows Server 2025 must have the number of allowed bad logon attempts configured to three or less. | Apply Variable."
      when:
        - win25stig_lockoutbadcount > 0
        - win25stig_lockoutbadcount <= 3
      community.windows.win_security_policy:
        section: System Access
        key: LockoutBadCount
        value: "{{ win25stig_lockoutbadcount }}"

# The below task is dependent on WN25-AC-000020, maybe custom fail when known error if WN25-AC-000020 not set? "The key 'ResetLockoutCount' in section 'System Access' is not a valid key, cannot set this value"

- name: "MEDIUM | WN25-AC-000010 | PATCH | Windows Server 2025 account lockout duration must be configured to 15 minutes or greater."
  when:
    - wn25_ac_000010 | bool
    - not discovered_account_policy_is_domain_scoped | bool
  tags:
    - WN25-AC-000010
    - CAT2
    - CCI-002238
    - SRG-OS-000329-GPOS-00128
    - SV-278033r1180805_rule
    - V-278033
    - NIST800-53_4_AC-7_b
  block:
    - name: "MEDIUM | WN25-AC-000010 | PATCH | Windows Server 2025 account lockout duration must be configured to 15 minutes or greater. | Warning For Bad Variable."
      when:
        - win25stig_lockoutduration < 15
        - win25stig_lockoutduration > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid number of minutes set for win25stig_lockoutduration please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN25-AC-000010 | PATCH | Windows Server 2025 account lockout duration must be configured to 15 minutes or greater. | Warn Count."
      when:
        - win25stig_lockoutduration < 15
        - win25stig_lockoutduration > 0
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-AC-000010"

    - name: "MEDIUM | WN25-AC-000010 | PATCH | Windows Server 2025 account lockout duration must be configured to 15 minutes or greater. | Apply Variable."
      when: win25stig_lockoutduration == 0 or win25stig_lockoutduration >= 15
      community.windows.win_security_policy:
        section: System Access
        key: LockoutDuration
        value: "{{ win25stig_lockoutduration }}"

- name: "MEDIUM | WN25-AC-000030 | PATCH | Windows Server 2025 must have the period of time before the bad logon counter is reset configured to 15 minutes or greater."
  when:
    - wn25_ac_000030 | bool
    - not discovered_account_policy_is_domain_scoped | bool
  tags:
    - WN25-AC-000030
    - CAT2
    - CCI-000044
    - SRG-OS-000021-GPOS-00005
    - SV-278035r1180811_rule
    - V-278035
    - NIST800-53_AC-7_a
    - NIST800-53_A_AC-7_1_ii
    - NIST800-53_4_AC-7_a
  block:
    - name: "MEDIUM | WN25-AC-000030 | AUDIT | Windows Server 2025 must have the period of time before the bad logon counter is reset configured to 15 minutes or greater. | Warning For Bad Variable."
      when: win25stig_resetlockoutcount > win25stig_lockoutduration or win25stig_resetlockoutcount < 15
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid number of minutes set for win25stig_resetlockoutcount please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN25-AC-000030 | AUDIT | Windows Server 2025 must have the period of time before the bad logon counter is reset configured to 15 minutes or greater. | Warn Count."
      when: win25stig_resetlockoutcount > win25stig_lockoutduration or win25stig_resetlockoutcount < 15
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-AC-000030"

    - name: "MEDIUM | WN25-AC-000030 | PATCH | Windows Server 2025 must have the period of time before the bad logon counter is reset configured to 15 minutes or greater. | Apply Variable."
      when:
        - win25stig_resetlockoutcount >= 15
        - win25stig_resetlockoutcount <= win25stig_lockoutduration
      community.windows.win_security_policy:
        section: System Access
        key: ResetLockoutCount
        value: "{{ win25stig_resetlockoutcount }}"

