- name: "MEDIUM | WN25-00-000280 | AUDIT | Windows Server 2025 must have a host-based firewall installed and enabled."
  when: wn25_00_000280 | bool
  tags:
    - WN25-00-000280
    - CAT2
    - CCI-002406
    - SRG-OS-000480-GPOS-00227
    - SV-278012r1181951_rule
    - V-278012
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
    - NIST800-53_4_CA-3_5
  block:
    - name: "MEDIUM | WN25-00-000280 | AUDIT | Windows Server 2025 must have a host-based firewall installed and enabled."
      ansible.windows.win_shell: |
        $FWProfiles = (Get-NetFirewallProfile);
        Write-Host "Windows Firewall Profile Statuses" -Foregroundcolor Yellow;
        $FWProfiles | %{
            If($_.Enabled -eq 1){
                Write-Host "The Windows Firewall $($_.Name) profile is enabled"
                }Else{
                Write-Host "The Windows Firewall $($_.Name) profile is disabled"
                }
            };
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000280_firewall_audit

    - name: "MEDIUM | WN25-00-000280 | AUDIT | Windows Server 2025 must have a host-based firewall installed and enabled. | Warning Message No Windows Firewall Enabled"
      when:
        - "'Domain profile is disabled' in discovered_00_000280_firewall_audit.stdout_lines | string"
        - "'Private profile is disabled' in discovered_00_000280_firewall_audit.stdout_lines | string"
        - "'Public profile is disabled' in discovered_00_000280_firewall_audit.stdout_lines | string"
      ansible.builtin.debug:
        msg:
          - "Warning!! This is a manual task. Windows Server 2025 must have a host-based firewall installed and enabled."
          - "Windows does not currently have its built-in firewall enabled."
          - "Please check for 3rd party firewall and verify the configuration requirements conform to firewall STIG standards."
          - "{{ discovered_00_000280_firewall_audit.stdout_lines }}"

    - name: "MEDIUM | WN25-00-000280 | AUDIT | Windows Server 2025 must have a host-based firewall installed and enabled. | Warning Message Windows Firewall On"
