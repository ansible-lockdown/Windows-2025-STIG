- name: "MEDIUM | WN25-00-000020 | AUDIT | Windows Server 2025 passwords for the built-in Administrator account must be changed at least every 60 days."
  when: wn25_00_000020 | bool
  tags:
    - WN25-00-000020
    - CAT2
    - CCI-004066
    - SRG-OS-000076-GPOS-00044
    - SV-277986r1182007_rule
    - V-277986
    - audit
    - NIST800-53_IA-5_1_d
    - NIST800-53A_IA-5_1_d
    - NIST800-53A_4_IA-5_1_d
  block:
    - name: "MEDIUM | WN25-00-000020 | AUDIT - DOMAIN CONTROLLER | Windows Server 2025 passwords for the built-in Administrator account must be changed at least every 60 days."
      when: "'controller' in ansible_facts['windows_domain_role']"
      ansible.windows.win_shell: "Get-ADUser -Filter * -Property PasswordLastSet | Where SID -like S-1-5-21-*-500 | Where-Object {$_.PasswordLastSet -lt ((Get-Date).AddDays(-{{ win25stig_pass_age_administrator }}))} | Select Name,PasswordLastSet"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000020_audit_dc

    - name: "MEDIUM | WN25-00-000020 | AUDIT - DOMAIN CONTROLLER | Windows Server 2025 passwords for the built-in Administrator account must be changed at least every 60 days."
      when:
        - discovered_00_000020_audit_dc is not skipped
        - discovered_00_000020_audit_dc.stdout != ""
      ansible.builtin.debug:
        msg:
          - "The following account appears to be the default admin account and the password does not meet the control specific age of {{ win25stig_pass_age_administrator }}"
          - "{{ discovered_00_000020_audit_dc.stdout.split('\n') }}"

    - name: "MEDIUM | WN25-00-000020 | AUDIT - DOMAIN MEMBERS OR STANDALONE | Windows Server 2025 passwords for the built-in Administrator account must be changed at least every 60 days."
      when: "'controller' not in ansible_facts['windows_domain_role']"
      ansible.windows.win_shell: "Get-Localuser -Name * | Select * | Where SID -like S-1-5-21-*-500 | Where-Object {$_.PasswordLastSet -lt ((Get-Date).AddDays(-{{ win25stig_pass_age_administrator }}))} | Select Name,PasswordLastSet"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000020_audit_dm_sa

    - name: "MEDIUM | WN25-00-000020 | AUDIT - DOMAIN MEMBERS OR STANDALONE | Windows Server 2025 passwords for the built-in Administrator account must be changed at least every 60 days."
      when:
        - discovered_00_000020_audit_dm_sa is not skipped
        - discovered_00_000020_audit_dm_sa.stdout != ""
      ansible.builtin.debug:
        msg:
          - "The following account appears to be the default admin account and the password does not meet the control specific age of {{ win25stig_pass_age_administrator }}"
          - "{{ discovered_00_000020_audit_dm_sa.stdout.split('\n') }}"

    - name: "MEDIUM | WN25-00-000020 | AUDIT | Windows Server 2025 passwords for the built-in Administrator account must be changed at least every 60 days. | Warn Count."
      when: discovered_00_000020_audit_dc is not skipped and discovered_00_000020_audit_dc.stdout != "" or discovered_00_000020_audit_dm_sa is not skipped and discovered_00_000020_audit_dm_sa.stdout != ""
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-00-000020"
