          - "{{ discovered_00_000200_audit_dm_sa.stdout.split('\n') }}"

    - name: "MEDIUM | WN25-00-000200 | AUDIT | Windows Server 2025 accounts must require passwords. | Warn Count."
      when:
        - not discovered_00_000200_audit_dc is skipped
        - discovered_00_000200_audit_dc.stdout != "" or
