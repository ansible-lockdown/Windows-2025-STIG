        - "'Private profile is enabled' in discovered_00_000280_firewall_audit.stdout_lines | string"
        - "'Public profile is enabled' in discovered_00_000280_firewall_audit.stdout_lines | string"
      ansible.builtin.debug:
        msg:
          - "Warning!! This is a manual task. Windows Server 2025 must have a host-based firewall installed and enabled."
          - "Windows host-based firewall currently is enabled on Domain, Private, And Public Profiles."
          - "Please check the firewall and verify the configuration requirements conform to firewall STIG standards."
          - "{{ discovered_00_000280_firewall_audit.stdout_lines }}"

    - name: "MEDIUM | WN25-00-000280 | AUDIT | Windows Server 2025 must have a host-based firewall installed and enabled. | Warning Message Windows Firewall Not Completely On"
      when: "'Domain profile is enabled' not in discovered_00_000280_firewall_audit.stdout_lines | string or 'Private profile is enabled' not in discovered_00_000280_firewall_audit.stdout_lines | string or 'Public profile is enabled' not in discovered_00_000280_firewall_audit.stdout_lines | string"
