      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000190_account_audit_dc
      when: "'controller' in ansible_facts['windows_domain_role']"

    - name: "MEDIUM | WN25-00-000190 | AUDIT - DOMAIN CONTROLLERS | Outdated or unused accounts must be removed from the system or disabled. | Warning Message."
      when:
        - discovered_00_000190_account_audit_dc is not skipped
        - discovered_00_000190_account_audit_dc.stdout != ""
      ansible.builtin.debug:
        msg:
          - "Warning!! This is a manual task. Outdated or unused accounts must be removed from"
          - "the Windows Server 2025 system or disabled."
          - "Accounts to exclude are the following:"
          - "Built-in administrator account (Renamed, SID ending in 500)"
          - "Built-in guest account (Renamed, Disabled, SID ending in 501)"
          - "Built-in default account (Renamed, Disabled, SID ending in 503)"
          - "Application accounts"
          - "Below is the list of User accounts found on the system. Please check the report"
          - "below and compare the STIG requirements."
          - "----------------------------------------------------------"
          - "{{ discovered_00_000190_account_audit_dc.stdout.split('\n') }}"
          - "----------------------------------------------------------"

    - name: "MEDIUM | WN25-00-000190 | AUDIT - DOMAIN MEMBERS OR STANDALONE | Outdated or unused accounts must be removed from the system or disabled. | Audit User Accounts"
      when: "'controller' not in ansible_facts['windows_domain_role']"
      ansible.windows.win_shell: |
        ([ADSI]('WinNT://{0}' -f $env:COMPUTERNAME)).Children | Where {
        $_.SchemaClassName -eq 'user' } | ForEach {
        $user = ([ADSI]$_.Path)
        $lastLogin = $user.Properties.LastLogin.Value
        $enabled = ($user.Properties.UserFlags.Value -band 0x2) -ne 0x2
        if ($lastLogin -eq $null) {
        $lastLogin = 'Never'
        }
        Write-Host $user.Name $lastLogin $enabled
        }
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000190_account_audit_dm_sa

    - name: "MEDIUM | WN25-00-000190 | AUDIT - DOMAIN MEMBERS OR STANDALONE | Outdated or unused accounts must be removed from the system or disabled. | Warning Message."
