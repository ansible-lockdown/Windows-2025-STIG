- name: "MEDIUM | WN25-00-000090 | AUDIT | Windows Server 2025 systems must have a Trusted Platform Module (TPM) enabled and ready for use."
  when: wn25_00_000090 | bool
  tags:
    - WN25-00-000090
    - CAT2
    - CCI-004910
    - SRG-OS-000780-GPOS-00240
    - SV-277993r1212171_rule
    - V-277993
    - NIST800-53_4_CM-6_b
    - NIST800-53_A_CM-6_1_iv
  block:
    # wmic was removed in Windows Server 2025, so this uses CIM. The old wmic call left the
    # register without stdout/stderr keys and every downstream conditional then raised
    # "dict object has no attribute stderr_lines".
    - name: "MEDIUM | WN25-00-000090 | AUDIT | Windows Server 2025 systems must have a Trusted Platform Module (TPM) enabled and ready for use. | Get TPM Settings"
      ansible.windows.win_shell: |
        $tpm = Get-CimInstance -Namespace root\cimv2\security\microsofttpm -ClassName Win32_Tpm -ErrorAction SilentlyContinue
        if ($null -eq $tpm) { "No Instance" }
        else { "IsActivated=$($tpm.IsActivated_InitialValue) IsEnabled=$($tpm.IsEnabled_InitialValue) IsOwned=$($tpm.IsOwned_InitialValue) SpecVersion=$($tpm.SpecVersion)" }
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000090_tpm_status

    - name: "MEDIUM | WN25-00-000090 | AUDIT | Windows Server 2025 systems must have a Trusted Platform Module (TPM) enabled and ready for use. | Running Instances Check."
      when: "'No Instance' in discovered_00_000090_tpm_status.stdout | default('', true)"
      ansible.builtin.debug:
        msg:
          - "Warning!! Please confirm TPM status is Ready for use, there are no instances currently running."

    - name: "MEDIUM | WN25-00-000090 | AUDIT | Windows Server 2025 systems must have a Trusted Platform Module (TPM) enabled and ready for use. | Full TPM Check."
      when:
        - "'No Instance' not in discovered_00_000090_tpm_status.stdout | default('', true)"
        - "'IsActivated=True' not in discovered_00_000090_tpm_status.stdout | default('', true) or
           'IsEnabled=True' not in discovered_00_000090_tpm_status.stdout | default('', true) or
           'IsOwned=True' not in discovered_00_000090_tpm_status.stdout | default('', true)"
      ansible.builtin.debug:
        msg:
          - "Warning!! Please confirm TPM status is Ready for use. Current settings do not meet STIG requirements."
          - "{{ discovered_00_000090_tpm_status.stdout | default('', true) | trim }}"

    - name: "MEDIUM | WN25-00-000090 | AUDIT | Windows Server 2025 systems must have a Trusted Platform Module (TPM) enabled and ready for use. | Warning Count"
      when: "'No Instance' in discovered_00_000090_tpm_status.stdout | default('', true) or
             'IsActivated=True' not in discovered_00_000090_tpm_status.stdout | default('', true) or
             'IsEnabled=True' not in discovered_00_000090_tpm_status.stdout | default('', true) or
             'IsOwned=True' not in discovered_00_000090_tpm_status.stdout | default('', true)"
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-00-000090"
