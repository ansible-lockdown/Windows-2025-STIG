- name: "MEDIUM | WN25-SO-000120 | PATCH | Windows Server 2025 machine inactivity limit must be set to 15 minutes or less, locking the system with the screen saver."
  when: wn25_so_000120 | bool
  tags:
    - WN25-SO-000120
    - CAT2
    - CCI-000056
    - CCI-000057
    - CCI-000060
    - SRG-OS-000028-GPOS-00009
