- name: "MEDIUM | WN25-SO-000400 | PATCH | Windows Server 2025 User Account Control must, at a minimum, prompt administrators for consent on the secure desktop."
  when: wn25_so_000400 | bool
  tags:
    - WN25-SO-000400
    - CAT2
    - CCI-001084
    - SRG-OS-000134-GPOS-00068
    - SV-278234r1182195_rule
    - V-278234
    - NIST800-53_SC-3
    - NIST800-53_A_SC-3_1_ii
    - NIST800-53_4_SC-3
  block:
    - name: "MEDIUM | WN25-SO-000400 | PATCH | Windows Server 2025 User Account Control must, at a minimum, prompt administrators for consent on the secure desktop. | Variable Check."
      when: win25stig_consentprompt < 1 or win25stig_consentprompt > 2
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not chosen the correct setting for win25stig_consentprompt"
          - "Please read the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN25-SO-000400 | PATCH | Windows Server 2025 User Account Control must, at a minimum, prompt administrators for consent on the secure desktop. | Warn Count."
      when: win25stig_consentprompt < 1 or win25stig_consentprompt > 2
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-SO-000400"

    - name: "MEDIUM | WN25-SO-000400 | PATCH | Windows Server 2025 User Account Control must, at a minimum, prompt administrators for consent on the secure desktop. | Apply Variable."
      when: win25stig_consentprompt == 1 or win25stig_consentprompt == 2
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        state: present
        value: ConsentPromptBehaviorAdmin
        data: "{{ win25stig_consentprompt }}"
        datatype: dword

