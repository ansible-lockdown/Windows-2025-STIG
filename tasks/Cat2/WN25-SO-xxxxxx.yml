---

- name: "MEDIUM | WN25-SO-000010 | PATCH | Windows Server 2025 must have the built-in guest account disabled."
  when:
    - wn25_so_000010 | bool
    - not discovered_account_policy_is_domain_scoped | bool
  tags:
    - WN25-SO-000010
    - CAT2
    - CCI-000804
    - SRG-OS-000121-GPOS-00062
    - SV-278195r1181291_rule
    - V-278195
    - NIST800-53_IA-8
    - NIST800-53_A_IA-8_1
    - NIST800-53_4_IA-8
  community.windows.win_security_policy:
    section: System Access
    key: EnableGuestAccount
    value: 0

# XCCDF: member servers and stand-alone systems only; not applicable for domain controllers.
- name: "MEDIUM | WN25-SO-000030 | PATCH | The Windows Server 2025 built-in administrator account must be renamed."
  when:
    - wn25_so_000030 | bool
    - "'controller' not in ansible_facts['windows_domain_role']"
    - not discovered_account_policy_is_domain_scoped | bool
  tags:
    - WN25-SO-000030
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-278197r1182315_rule
    - V-278197
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  block:
    - name: "MEDIUM | WN25-SO-000030 | AUDIT | The Windows Server 2025 built-in administrator account must be renamed. | Warning For Bad Variable."
      when: "'adminchangethis' in win25stig_newadministratorname"
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not changed the default name for win25stig_newadministratorname, please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN25-SO-000030 | AUDIT | The Windows Server 2025 built-in administrator account must be renamed. | Warn Count."
      when: "'adminchangethis' in win25stig_newadministratorname"
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-SO-000030"

    - name: "MEDIUM | WN25-SO-000030 | PATCH | The Windows Server 2025 built-in administrator account must be renamed. | Set Variable."
      when: "'adminchangethis' not in win25stig_newadministratorname"
      community.windows.win_security_policy:
        section: System Access
        key: NewAdministratorName
        value: "{{ win25stig_newadministratorname }}"

