  tags:
    - WN25-SO-000350
    - CAT2
    - CCI-000186
    - SRG-OS-000067-GPOS-00035
    - SV-278229r1181393_rule
    - V-278229
    - NIST800-53_IA-5_2
    - NIST800-53_A_IA-5_1
    - NIST800-53_4_IA-5_2_a
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Cryptography
    value: ForceKeyProtection
    data: 2
    datatype: dword

- name: "MEDIUM | WN25-SO-000360 | PATCH | Windows Server 2025 must be configured to use FIPS-compliant algorithms for encryption, hashing, and signing. This is NA if the host is running SharePoint"
