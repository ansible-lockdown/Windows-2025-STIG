# XCCDF: member servers and stand-alone systems only; not applicable for domain controllers.
- name: "MEDIUM | WN25-SO-000100 | PATCH | Windows Server 2025 maximum age for machine account passwords must be configured to 30 days or less."
  when:
    - wn25_so_000100 | bool
    - "'controller' not in ansible_facts['windows_domain_role']"
  tags:
    - WN25-SO-000100
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-278204r1182319_rule
    - V-278204
    - NIST800-53_CM-6_b
    - NIST800-53_A_CM-6_1_iv
    - NIST800-53_4_CM-6_b
  block:
    - name: "MEDIUM | WN25-SO-000100 | AUDIT | Windows Server 2025 maximum age for machine account passwords must be configured to 30 days or less. | Number Of Days Check."
      when: win25stig_machineaccountpassword_max_age > 30 or win25stig_machineaccountpassword_max_age == 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not set the right number of days for win25stig_machineaccountpassword_max_age"
          - "Please read the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN25-SO-000100 | AUDIT | Windows Server 2025 maximum age for machine account passwords must be configured to 30 days or less. | Warn Count."
      when: win25stig_machineaccountpassword_max_age > 30 or win25stig_machineaccountpassword_max_age == 0
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-SO-000100"

    - name: "MEDIUM | WN25-SO-000100 | PATCH | Windows Server 2025 maximum age for machine account passwords must be configured to 30 days or less. | Apply Variable."
      when:
        - win25stig_machineaccountpassword_max_age <= 30
        - win25stig_machineaccountpassword_max_age != 0
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        state: present
        value: MaximumPasswordAge
        data: "{{ win25stig_machineaccountpassword_max_age }}"
        datatype: dword

