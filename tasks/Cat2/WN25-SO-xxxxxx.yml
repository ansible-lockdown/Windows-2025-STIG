    - NIST800-53_AC-11_1
    - NIST800-53_A_AC-11_1_1
    - NIST800-53_4_AC-11_1
  block:
    - name: "MEDIUM | WN25-SO-000120 | AUDIT | Windows Server 2025 machine inactivity limit must be set to 15 minutes or less, locking the system with the screen saver. | Number Of Seconds Check."
      when: win25stig_inactivitytimeoutsecs > 900 or win25stig_inactivitytimeoutsecs == 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not set the right number of seconds for win25stig_inactivitytimeoutsecs"
          - "Please read the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN25-SO-000120 | AUDIT | Windows Server 2025 machine inactivity limit must be set to 15 minutes or less, locking the system with the screen saver. | Warn Count."
      when: win25stig_inactivitytimeoutsecs > 900 or win25stig_inactivitytimeoutsecs == 0
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: "WN25-SO-000120"

    - name: "MEDIUM | WN25-SO-000120 | PATCH | Windows Server 2025 machine inactivity limit must be set to 15 minutes or less, locking the system with the screen saver. | Apply Variable."
      when:
        - win25stig_inactivitytimeoutsecs <= 900
        - win25stig_inactivitytimeoutsecs != 0
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        state: present
        value: InactivityTimeoutSecs
        data: "{{ win25stig_inactivitytimeoutsecs }}"
        datatype: dword

