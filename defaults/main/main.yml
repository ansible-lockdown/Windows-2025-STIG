---

# defaults file for Windows-2025-STIG

## metadata for Audit benchmark
benchmark_version: 'v1.2.0'

## Benchmark name used by auditing control role
benchmark: Windows-2025-STIG

# Whether to skip the OS check for supported OS's
skip_os_check: false

# Create managed not custom local_facts files
create_benchmark_facts: true
ansible_facts_path: 'C:\ProgramData\ansible\facts.d'

# CAT 1
win25stig_cat1_controls: true
# CAT 2
win25stig_cat2_controls: true
# CAT 3
win25stig_cat3_controls: true

# skip_reboot true warns that a reboot is outstanding instead of performing it.
skip_reboot: true

# We've defined complexity-high as cannot automatically remediate
# the rule in question.  In the future, this might mean that the remediation
# may fail in some cases.
win25stig_complexity_high: false

# Show "changed" for complex items not remediated per complexity-high setting
# to make them stand out.  "changed" items on a second run of the role would
# indicate items requiring manual review.
win25stig_audit_complex: true

# We've defined disruption-high to indicate items that are likely to cause
# disruption in a normal workflow.  These items can be remediated automatically
# but are disabled by default to avoid disruption.
win25stig_disruption_high: false

# Show "changed" for disruptive items not remediated per disruption-high
# setting to make them stand out.
win25stig_audit_disruptive: true

# This parameter disables controls that could have a very lengthy find. For example,
# removing all files of a specific file type that search the entire drive.
# If there is an action tied to the lengthy search the action task will be disabled as well.
# WN25-00-000240 - CAT2
win25stig_lengthy_search: false

# win_skip_for_test is used in the playbook to skip over WINRM based controls that
# may cause WINRM Basic Connection Type to be disabled.
# Setting win_skip_for_test to 'false' will enable Secure Connection types only.
# WINRM Controls that will be skipped:
# WN25-CC-000470 - CAT1
# WN25-CC-000500 - CAT1
# WN25-CC-000480 - CAT2
# WN25-CC-000510 - CAT2
# WN25-CC-000520 - CAT2
# WN25-MS-000020 - CAT2 - LocalAccountTokenFilterPolicy=0, severs WinRM/psrp for a LOCAL account
# WN25-MS-000080 - CAT2 - denies network logon to local accounts AND to Domain/Enterprise Admins,
#                          severs BOTH WinRM and SSH, console-only recovery
win_skip_for_test: false

# Both MS-000020 and MS-000080 are ALSO skipped automatically when the run connects as a
# local account, whatever win_skip_for_test is set to. prelim.yml sets
# prelim_control_account_is_local and prelim_local_account_network_logon from
# ansible_connection and ansible_user. A DOMAIN account that is neither a Domain Admin nor
# an Enterprise Admin, holding local Administrators on the target, survives both.

# ── OpenSSH (WN25-SH-*) ──────────────────────────────────────────────────────────
# The SH band is new in the Windows Server 2025 STIG. WN25-SH-000010 requires OpenSSH to be
# installed and running; that adds a listening network service, so it is opt-in rather than
# applied by default. Set this true where the STIG requirement applies.
win25stig_install_openssh: false

# The remaining SH controls only harden an OpenSSH that is already present. prelim.yml sets
# prelim_openssh_configured, and they no-op on a host where OpenSSH has never generated a
# sshd_config rather than failing.

# Path to the OpenSSH server configuration. This is the Windows default location.
win25stig_sshd_config_path: 'C:\ProgramData\ssh\sshd_config'

# Directory holding sshd_config, the host keys and the banner file.
win25stig_ssh_data_dir: 'C:\ProgramData\ssh'

# WN25-SH-000020 - banner file referenced by the Banner directive. Rendered from
# win25stig_legalnoticetext so the SSH banner and the interactive logon notice stay identical.
win25stig_ssh_banner_path: 'C:\ProgramData\ssh\Banner.txt'

# The SH configuration controls render templates/sshd_config.j2 over the whole file, because the
# STIG check for each of them greps sshd_config directly and would not see a drop-in. These four
# directives are not mandated by the benchmark but are shipped by Windows OpenSSH, so they are
# reproduced in the template. The defaults below are exactly what Windows writes on first start.
# Losing the Match block breaks administrator public key authentication; losing AllowGroups
# changes who may log in.
win25stig_sshd_authorizedkeysfile: '.ssh/authorized_keys'
win25stig_sshd_sftp_subsystem: 'sftp-server.exe'
win25stig_sshd_allowgroups: 'administrators "openssh users"'
win25stig_sshd_admin_authorizedkeysfile: '__PROGRAMDATA__/ssh/administrators_authorized_keys'

# WN25-SH-000050 - RekeyLimit. STIG example is "1G 1h".
win25stig_ssh_rekeylimit: '1G 1h'

# WN25-SH-000060 - ClientAliveCountMax. STIG requires 1.
win25stig_ssh_clientalivecountmax: 1

# WN25-SH-000070 - ClientAliveInterval in seconds. STIG requires 600 (10 minutes).
win25stig_ssh_clientaliveinterval: 600

# Set true to suppress the sshd restart the SH controls would otherwise trigger. Useful when
# the remediation runs over the SSH connection it is about to bounce.
win25stig_skip_sshd_restart: false

