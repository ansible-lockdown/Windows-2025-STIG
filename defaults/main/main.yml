# CAT 2 defaults

# WN25-00-000020
# Windows Server 2025 passwords for the built-in Administrator account must be changed at least every 60 days.
# If the PasswordLastSet date is greater than win25stig_pass_age_administrator days old, this is a finding.
win25stig_pass_age_administrator: 60

# WN25-AC-000010
# Windows Server 2025 account lockout duration must be configured to 15 minutes or greater.
# Configuring this to "0", requiring an administrator to unlock the account, is more restrictive and is not a finding.
# Valid Variables are equal to 0 or greater than or equal to 15.
win25stig_lockoutduration: 15

# WN25-AC-000020
# Windows Server 2025 must have the number of allowed bad logon attempts configured to three or less.
# and may not be set to 0.
win25stig_lockoutbadcount: 3

# WN25-AC-000030
# Windows Server 2025 must have the period of time before the bad logon counter is reset configured to 15 minutes or greater.
# win25stig_resetlockoutcount is the Reset account lockout counter after value in minutes.
win25stig_resetlockoutcount: 15

# WN25-AC-000040
# Windows Server 2025 password history must be configured to 24 passwords remembered.
# win25stig_passwordhistorysize is the number of passwords Windows will remember before you may
# be able to reuse that same password. The default value is "24" for Windows domain systems.
# DoD determined appropriate the value for all Windows systems.
win25stig_passwordhistorysize: 24

# WN25-AC-000050
# Windows Server 2025 maximum password age must be configured to 60 days or less and cannot be 0.
# win25stig_maximumpasswordage is the Maximum password age value in days.
win25stig_maximumpasswordage: 60

# WN25-AC-000060
# Windows Server 2025 minimum password age must be configured to at least one day and cannot be set to 0.
# win25stig_minimumpasswordage is the Minimum password age value in days.
win25stig_minimumpasswordage: 1

# WN25-CC-000110
# Windows Server 2025 virtualization-based security must be enabled with the platform security
# level configured to Secure Boot or Secure Boot with DMA Protection.
# win25stig_dma_protection is the level that they would like to set up.
# Valid settings are as follows.
# 1 (Secure Boot only)
# 3 (Secure Boot and DMA Protection)
win25stig_dma_protection: 3

# WN25-CC-000140
# Early Launch Antimalware, Boot-Start Driver Initialization Policy must prevent boot drivers identified as bad.
# win25stig_driver_load_policy is the registry value that will be applied. The default behavior is for
# Early Launch Antimalware - Boot-Start Driver Initialization policy to enforce "Good, unknown and bad but
# critical" (preventing "bad").
# Approved values are below:
# 8 - Good only
# 1 - Good and unknown
# 3 - Good, unknown, and bad but critical
win25stig_driver_load_policy: 1

# WN25-CC-000270
# Windows Server 2025 Application event log size must be configured to 32768 KB or greater.
# win25stig_application_event_log_max_size is the EventLog Application max log size value in KB.
win25stig_application_event_log_max_size: 32768

# WN25-CC-000250
# Telemetry must be configured to limit diagnostic data sent to Microsoft.
# Valid values are 0 (diagnostic data off) or 1 (required diagnostic data).
# 3 (optional/Full) is a finding under V1R2.
win25stig_allow_telemetry: 1

# WN25-CC-000280
# The security event log size must hold at least one week's worth of audit records.
# V1R2 requires 0x4E2000 (5120000) or greater.
# win25stig_security_event_log_max_size is the EventLog Security max log size value in KB.
win25stig_security_event_log_max_size: 5120000

# WN25-CC-000290
# Windows Server 2025 System event log size must be configured to 32768 KB or greater.
# win25stig_system_event_log_max_size is the EventLog System max log size value in KB.
win25stig_system_event_log_max_size: 32768

# WN25-DC-000340
# Windows Server 2025 Access this computer from the network user right must only be assigned to the
# Administrators, Authenticated Users, and Enterprise Domain Controllers groups on domain controllers.
# If any SIDs other than the following are granted the "SeNetworkLogonRight" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: Administrators,Authenticated Users,Enterprise Domain Controllers
win25stig_senetworklogonright_dc: Administrators,Authenticated Users,Enterprise Domain Controllers

# WN25-DC-000405
# Windows Server 2025 must be configured for certificate-based authentication for domain controllers.
# Active Directory domain services elevation of privilege vulnerability could allow a user rights to the system,
# such as administrative and other high-level capabilities. This applies to domain controllers. This is not
# applicable for member servers.Value Name: StrongCertificateBindingEnforcement 1 or 2
# Value 1 = Compatibility Mode
# Value 2 = Full Enforcement
win25stig_strong_certificate_binding_enforcement_value: 2

# WN25-DC-000430
# The password for the krbtgt account on a domain must be reset at least every 180 days.
# The default setting here matches the STIG requirements. If you would like to
# enforce a more strict policy you may do so for auditing purposes.
# NOTE: Valid Days are 180 or less.
win25stig_krbtgt_account_pass_age: 180

# WN25-MS-000050
# Windows Server 2025 must limit the caching of logon credentials to four or less on
# domain-joined member servers. The registry value is a REG_SZ, so this is quoted.
# NOTE: Valid values are 4 or less.
win25stig_cached_logons_count: "4"

# WN25-MS-000070
# Windows Server 2025 "Access this computer from the network" user right must only be assigned to the Administrators
# and Authenticated Users groups on domain-joined member servers and standalone or nondomain-joined systems.
# If any SIDs other than the following are granted the "SeNetworkLogonRight" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: Administrators,Authenticated Users
win25stig_senetworklogonright: Administrators,Authenticated Users

# WN25-SO-000030
# Windows Server 2025 built-in administrator account must be renamed.
# win25stig_newadministratorname is the non-default name for the Administrator Account.
win25stig_newadministratorname: adminchangethis

# WN25-SO-000040
# Windows Server 2025 built-in guest account must be renamed.
# win25stig_newguestname is the non-default name for the guest Account.
win25stig_newguestname: guestchangethis

# WN25-SO-000100
# The maximum age for machine account passwords must be configured to 30 days or less.
# win25stig_machineaccountpassword_max_age is the setting for the Computer account passwords
# that are changed automatically on a regular basis. This setting controls the maximum password
# age that a machine account may have. This must be set to no more than 30 days, ensuring
# the machine changes its password monthly.
win25stig_machineaccountpassword_max_age: 30

# WN25-SO-000120
# The machine inactivity limit must be set to 15 minutes, locking the system with the screen saver.
# win25stig_inactivitytimeoutsecs is the time in seconds that will be set in the registry that
# enagages the screen saver. The default setting is "900" seconds or less excluding "0"
win25stig_inactivitytimeoutsecs: 900

# WN25-SO-000130
# Windows Server 2025 required legal notice must be configured to display before console logon.
# win25stig_legalnoticetext is the LegalNoticeText for Win logon.
win25stig_legalnoticetext: |
  You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.

  By using this IS (which includes any device attached to this IS), you consent to the following conditions:

  -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.

  -At any time, the USG may inspect and seize data stored on this IS.

  -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.

  -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.

  -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.

# WN25-SO-000400
# User Account Control must, at a minimum, prompt administrators for consent on the secure desktop.
# The more secure option for this setting, "Prompt for credentials on the secure desktop"
# Default setting is 2
# 2 -(Prompt for consent on the secure desktop)
# 1 -(Prompt for credentials on the secure desktop)
win25stig_consentprompt: 2

# WN25-UR-000030
# The Allow log on locally user right must only be assigned to the Administrators group.
# If any SIDs other than the following are granted the "SeInteractiveLogonRight" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: Administrators
win25stig_seinteractivelogonright: Administrators

# WN25-UR-000040
# The Backup files and directories user right must only be assigned to the Administrators group.
# If any SIDs other than the following are granted the "SeBackupPrivilege" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: Administrators
win25stig_sebackupprivilege: Administrators

# WN25-UR-000070
# The Create global objects user right must only be assigned to Administrators, Service, Local Service, and Network Service.
# If any SIDs other than the following are granted the "SeCreateGlobalPrivilege" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: Administrators,Service,Local Service,Network Service
win25stig_secreateglobalprivilege: Administrators,Service,Local Service,Network Service

# WN25-UR-000120
# The Generate security audits user right must only be assigned to Local Service and Network Service.
# If any SIDs other than the following are granted the "SeAuditPrivilege" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: Local Service,Network Service
win25stig_seauditprivilege: Local Service,Network Service

# WN25-UR-000130
# The "Impersonate a client after authentication" user right must only be assigned to Administrators, Service, Local Service, and Network Service.
# If any SIDs other than the following are granted the "SeImpersonatePrivilege" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: Administrators,Service,Local Service,Network Service
win25stig_seimpersonateprivilege: Administrators,Service,Local Service,Network Service

# WN25-UR-000140
# The Increase scheduling priority user right must only be assigned to the Administrators group.
# If any SIDs other than the following are granted the "SeIncreaseBasePriorityPrivilege" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: Administrators
win25stig_seincreasebasepriorityprivilege: Administrators

# WN25-UR-000160
# The Lock pages in memory user right must not be assigned to any groups or accounts.
# If any SIDs are granted the "SeLockMemoryPrivilege" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: ""
win25stig_selockmemoryprivilege: []

# WN25-UR-000170
# The Manage auditing and security log user right must only be assigned to the Administrators group.
# If any SIDs other than the following are granted the "SeSecurityPrivilege" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# If the organization has an Auditors group, the assignment of this group to the user right would not be a finding.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: Administrators
win25stig_sesecurityprivilege: Administrators

# WN25-UR-000210
# The Restore files and directories user right must only be assigned to the Administrators group.
# If any SIDs other than the following are granted the "SeRestorePrivilege" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: Administrators
win25stig_serestoreprivilege: Administrators

# WN25-UR-000220
# The Take ownership of files or other objects user right must only be assigned to the Administrators group.
# If any SIDs other than the following are granted the "SeTakeOwnershipPrivilege" user right, this is a finding.
# If an application requires this user right, this would not be a finding. Vendor documentation must support the
# requirement for having the user right. The requirement must be documented with the ISSO.
# NOTE: Improper Accounts Or Groups listed here will FAIL task.
# Default: Administrators
win25stig_setakeownershipprivilege: Administrators

# CAT 3 defaults

# WN25-CC-000260
# Windows Server 2025 Windows Update must not obtain updates from other PCs on the Internet.
# Valid Settings are as follows.
# 0x00000000 (0) - No peering (HTTP Only)
# 0x00000001 (1) - Peers on same NAT only (LAN)
# 0x00000002 (2) - Local Network / Private group peering (Group)
# 0x00000063 (99) - Simple download mode, no peering (Simple)
# 0x00000064 (100) - Bypass mode, Delivery Optimization not used (Bypass)
win25stig_dodownloadmode: 1

# WN25-SO-000140
# The Windows dialog box title for the legal banner must be configured with the appropriate text.
# "DoD Notice and Consent Banner", "US Department of Defense Warning Statement", or an organization-defined equivalent.
# If an organization-defined title is used, it can in no case contravene or modify the language of the banner text required in WN25-SO-000130.
# Automated tools may only search for the titles defined above. If an organization-defined title is used, a manual review will be required.
# WN25-SO-000140 checks the banner TITLE, not the body. The XCCDF says automated tools may only
# search for the titles listed, so this must be one of them - not the banner text.
# Accepted values: "DOD Notice and Consent Banner", "US Department of Defense Warning Statement",
# or an organization-defined equivalent.
win25stig_legalnoticecaption: "DOD Notice and Consent Banner"

# Per-user (HKEY_USERS) controls
# win25stig_load_user_hives controls whether prelim loads the Default profile and the hive of
# every user profile, local and domain, so the per-user controls can write to each of them.
# The per-user controls never write to HKCU, which would be the connecting account's own hive and
# take effect for nobody. With this disabled they reach only the hives Windows already has loaded,
# plus the Default profile through its file. The hives the role loads are unloaded again at the
# end of the run.
# Default: true
win25stig_load_user_hives: true
